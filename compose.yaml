services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    command: ["pnpm", "exec", "vinext", "dev", "--hostname", "0.0.0.0"]
    volumes:
      - ./app:/app/app
      - ./public:/app/public
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WRANGLER_LOG_PATH: ".wrangler/wrangler.log"
    init: true

volumes:
  node_modules:
